# Model registry. Change model_id here, not in source.
models:
  llama-3.1-8b:
    backend: hf
    # Llama-3.1-8B-Instruct (the chat-tuned variant) is the right pick for
    # CoT prompting. The base model would not follow the "Step N:" format.
    model_id: meta-llama/Llama-3.1-8B-Instruct
    fallback_model_id: NousResearch/Meta-Llama-3.1-8B-Instruct  # ungated mirror
    dtype: bfloat16
    max_new_tokens: 1024
    temperature: 0.0

  gemma-3-12b:
    backend: hf
    # Gemma 3 12B Instruct (primary); 4B Instruct if the 12B checkpoint fails to load.
    model_id: google/gemma-3-12b-it
    fallback_model_id: google/gemma-3-4b-it
    dtype: bfloat16
    load_in_4bit: false        # set true if you hit OOM (unlikely for 12B on A100)
    max_new_tokens: 1024
    temperature: 0.0

  claude-opus-4-6:
    backend: anthropic
    model_id: claude-opus-4-6
    max_new_tokens: 1024
    temperature: 0.0

# Dataset sizes
data:
  gsm8k_n: 50
  bbh_n: 25
  seed: 42

# Attention analysis subset
attention:
  n_faithful: 10      # baseline correct AND perturbed incorrect (CoT mattered)
  n_unfaithful: 10    # baseline correct AND perturbed still correct (CoT ignored)
  n_hard: 10          # hardest problems (by difficulty bucket)
